<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Aplikasi Kas STM</title>
  <style>
    /* Layar muat (docs/03 §3): tampil 1–3 detik sementara server Next disiapkan. Warna = token globals.css */
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #f7f8fa; color: #111827; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    .kotak { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    p { margin: 0; font-size: 15px; color: #6b7280; }
    .bilah { width: 200px; height: 6px; border-radius: 3px; background: #e6e8ec; overflow: hidden; }
    .bilah i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #1d4ed8; animation: geser 1.2s ease-in-out infinite; }
    @keyframes geser { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div class="kotak">
    <img src="logo.png" alt="" />
    <h1>Aplikasi Kas STM</h1>
    <p>Menyiapkan aplikasi…</p>
    <div class="bilah"><i></i></div>
  </div>
</body>
</html>
